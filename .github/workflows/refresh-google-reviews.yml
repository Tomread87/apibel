name: Refresh Apibel reviews snapshot

on:
  workflow_dispatch:
  schedule:
    # Daily check; the Python script makes an API call only if 96h has elapsed.
    - cron: '0 6 * * *'

# NOTE: Disabled until an authorized source and storage rights are confirmed.
# Google Places API policies generally prohibit caching/redistributing reviews.
permissions:
  contents: write

concurrency:
  group: apibel-reviews-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ vars.ENABLE_GOOGLE_REVIEW_CACHE == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh snapshot if at least 96 hours old
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/refresh_google_reviews.py
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A static/data/google-reviews.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh Apibel review snapshot"
            git push
          else
            echo "No snapshot changes"
          fi


  test_snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create test JSON
        run: |
          mkdir -p static/data

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          data = {
              "test": True,
              "placeId": "ChIJWVfiXABzhkcRh_osv744VoU",
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "reviews": []
          }

          with open("static/data/test-snapshot.json", "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Commit test JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add static/data/test-snapshot.json
          git commit -m "test: generate snapshot JSON"
          git push
